# WHUT 校招工具 —— 宝塔 nginx 反代（HTTP Basic 认证）
#
# 用法：放到 /www/server/panel/vhost/nginx/whut.conf，然后 nginx -t && nginx -s reload
# 说明：容器只监听 127.0.0.1:8765，公网一律从这层进来，先过用户名口令再转发。
#       口令文件用 htpasswd 生成：
#         printf 'whut:%s\n' "$(openssl passwd -apr1 '你的密码')" > /www/server/nginx/conf/htpasswd.whut

server {
    listen 80;
    # 改成你的服务器 IP 或域名（示例里用 _ 兜底，直接复制也能跑）
    server_name _;

    auth_basic           "WHUT Recruit";
    auth_basic_user_file /www/server/nginx/conf/htpasswd.whut;

    # 抓取/分析是长任务，别让 nginx 提前断开
    proxy_read_timeout   300s;
    proxy_send_timeout   300s;
    # 任务中心是流式输出，关掉缓冲才能实时看到进度
    proxy_buffering      off;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    access_log /www/wwwlogs/whut.access.log;
}
