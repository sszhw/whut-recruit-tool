[project]
name = "whut-recruit-tool"
version = "0.2.0"
description = "武汉理工大学校招信息采集、企业分析与投递推荐工具（本地单机 Flask + 单页前端）"
requires-python = ">=3.10"
# 运行期依赖见 requirements.txt（flask / requests / openpyxl / python-docx）

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]            # 让测试直接 import server / repository / resume
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  "E501",   # 长行由 line-length 控制，中文注释/字符串较宽
  "B008",   # 保留 Flask 常见写法
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]   # 测试需先注入 sys.path 再导入应用模块

[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "Windows"
include = ["app"]
exclude = ["**/__pycache__", "data", "docs"]
# 先用 basic：本项目大量 dict[str, Any]，strict 会被淹掉
typeCheckingMode = "basic"
# openpyxl / python-docx 都未随包提供类型标注（无 py.typed），pyright 会把
# Workbook() 之类推断成 Unknown，进而报出一串 "is not a known attribute of None" 的假错。
# 在装齐类型桩之前，缺失导入只当警告，不阻塞。
reportMissingImports = "warning"
# 本地运行若发现依赖全解析不到，多半是 pyright 挑错了解释器，显式指定：
#   node <workspace>/node_modules/pyright/index.js --pythonpath <装了 requirements.txt 的 python.exe>
# 暂时不进 CI：等既有的类型问题清完再开启，否则一上来就红。
